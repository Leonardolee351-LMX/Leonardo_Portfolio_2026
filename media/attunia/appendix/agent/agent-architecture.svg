<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Attunia Agent 框架：Tuno 编排 · Friends 多专家 · EEG/情境入 → 交付 → 本机记忆</title>
  <desc id="desc">Architecture diagram for Attunia Soft Healthcare agent stack.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141816"/>
      <stop offset="100%" stop-color="#1c2220"/>
    </linearGradient>
    <linearGradient id="tuno" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f6b4f"/>
      <stop offset="100%" stop-color="#1e4534"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9aa89a"/>
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="48" y="52" fill="#f2eee4" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="28" font-weight="700">Attunia Agent 框架</text>
  <text x="48" y="82" fill="#9aa89a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">EEG / 情境入 → Tuno 编排 → Friends 多专家（目录拼接）→ 短训交付 → 本机记忆回写</text>
  <text x="48" y="104" fill="#6f7f6f" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">原始脑电与可识别健康信息不进外部 LLM · 用户保留确认 / 拒绝 / 暂停</text>

  <!-- INPUT -->
  <g filter="url(#soft)">
    <rect x="48" y="150" width="240" height="420" rx="18" fill="#222926" stroke="#3a4840"/>
    <text x="168" y="186" text-anchor="middle" fill="#d7e3d4" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="700">输入层</text>
    <rect x="72" y="210" width="192" height="72" rx="12" fill="#2a3330"/>
    <text x="168" y="240" text-anchor="middle" fill="#f2eee4" font-size="14" font-family="Segoe UI, Microsoft YaHei, sans-serif">BrainLink / EEG</text>
    <text x="168" y="262" text-anchor="middle" fill="#9aa89a" font-size="12" font-family="Segoe UI, Microsoft YaHei, sans-serif">唤醒 · 专注 · 平静</text>
    <rect x="72" y="300" width="192" height="72" rx="12" fill="#2a3330"/>
    <text x="168" y="330" text-anchor="middle" fill="#f2eee4" font-size="14" font-family="Segoe UI, Microsoft YaHei, sans-serif">情境 / 作息</text>
    <text x="168" y="352" text-anchor="middle" fill="#9aa89a" font-size="12" font-family="Segoe UI, Microsoft YaHei, sans-serif">时间窗 · 可用分钟 · 睡眠</text>
    <rect x="72" y="390" width="192" height="72" rx="12" fill="#2a3330"/>
    <text x="168" y="420" text-anchor="middle" fill="#f2eee4" font-size="14" font-family="Segoe UI, Microsoft YaHei, sans-serif">用户表述</text>
    <text x="168" y="442" text-anchor="middle" fill="#9aa89a" font-size="12" font-family="Segoe UI, Microsoft YaHei, sans-serif">目标 · 红线 · 偏好</text>
    <rect x="72" y="480" width="192" height="60" rx="12" fill="#1a2420" stroke="#456050"/>
    <text x="168" y="516" text-anchor="middle" fill="#a8c4b0" font-size="12" font-family="Segoe UI, Microsoft YaHei, sans-serif">仅统计特征进入编排</text>
  </g>

  <!-- arrows in -->
  <line x1="288" y1="360" x2="350" y2="360" stroke="#9aa89a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- TUNO -->
  <g filter="url(#soft)">
    <rect x="350" y="200" width="260" height="320" rx="18" fill="url(#tuno)" stroke="#6fbf91"/>
    <text x="480" y="240" text-anchor="middle" fill="#f5fff5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="700">Tuno 中枢</text>
    <text x="480" y="266" text-anchor="middle" fill="#c7e6d2" font-size="12" font-family="Segoe UI, Microsoft YaHei, sans-serif">编排 · 判定 · 边界守卫</text>
    <rect x="374" y="290" width="212" height="44" rx="10" fill="#173528"/>
    <text x="480" y="318" text-anchor="middle" fill="#e8f6ec" font-size="13" font-family="Segoe UI, Microsoft YaHei, sans-serif">1. assessState / 目标顺序</text>
    <rect x="374" y="348" width="212" height="44" rx="10" fill="#173528"/>
    <text x="480" y="376" text-anchor="middle" fill="#e8f6ec" font-size="13" font-family="Segoe UI, Microsoft YaHei, sans-serif">2. 派工（最多 2 步）</text>
    <rect x="374" y="406" width="212" height="44" rx="10" fill="#173528"/>
    <text x="480" y="434" text-anchor="middle" fill="#e8f6ec" font-size="13" font-family="Segoe UI, Microsoft YaHei, sans-serif">3. 拼接目录模块</text>
    <rect x="374" y="464" width="212" height="36" rx="10" fill="#0f241a"/>
    <text x="480" y="488" text-anchor="middle" fill="#9fd0b2" font-size="12" font-family="Segoe UI, Microsoft YaHei, sans-serif">禁止即兴 / 生图 / 作曲</text>
  </g>

  <line x1="610" y1="360" x2="670" y2="360" stroke="#9aa89a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- FRIENDS -->
  <g filter="url(#soft)">
    <rect x="670" y="150" width="250" height="420" rx="18" fill="#222926" stroke="#3a4840"/>
    <text x="795" y="186" text-anchor="middle" fill="#d7e3d4" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="700">Friends 多专家</text>
    <text x="795" y="208" text-anchor="middle" fill="#8fa08f" font-size="11" font-family="Segoe UI, Microsoft YaHei, sans-serif">只从已有疗法目录挑模块</text>
    <rect x="694" y="230" width="202" height="48" rx="10" fill="#2a3330"/>
    <text x="795" y="260" text-anchor="middle" fill="#f2eee4" font-size="13" font-family="Segoe UI, Microsoft YaHei, sans-serif">Mira · 减压 / 停下</text>
    <rect x="694" y="290" width="202" height="48" rx="10" fill="#2a3330"/>
    <text x="795" y="320" text-anchor="middle" fill="#f2eee4" font-size="13" font-family="Segoe UI, Microsoft YaHei, sans-serif">Chen · 认知卸负荷</text>
    <rect x="694" y="350" width="202" height="48" rx="10" fill="#2a3330"/>
    <text x="795" y="380" text-anchor="middle" fill="#f2eee4" font-size="13" font-family="Segoe UI, Microsoft YaHei, sans-serif">Kai · 心流入场</text>
    <rect x="694" y="410" width="202" height="48" rx="10" fill="#2a3330"/>
    <text x="795" y="440" text-anchor="middle" fill="#f2eee4" font-size="13" font-family="Segoe UI, Microsoft YaHei, sans-serif">Vega · 睡前 / 下行</text>
    <rect x="694" y="470" width="202" height="48" rx="10" fill="#2a3330"/>
    <text x="795" y="500" text-anchor="middle" fill="#f2eee4" font-size="13" font-family="Segoe UI, Microsoft YaHei, sans-serif">Sona · 目录声景点选</text>
    <text x="795" y="545" text-anchor="middle" fill="#6f7f6f" font-size="11" font-family="Segoe UI, Microsoft YaHei, sans-serif">无专家多轮互改</text>
  </g>

  <line x1="920" y1="360" x2="980" y2="360" stroke="#9aa89a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- OUTPUT + MEMORY -->
  <g filter="url(#soft)">
    <rect x="980" y="180" width="180" height="160" rx="16" fill="#2a3330" stroke="#4a5c50"/>
    <text x="1070" y="230" text-anchor="middle" fill="#f2eee4" font-size="15" font-weight="700" font-family="Segoe UI, Microsoft YaHei, sans-serif">短训交付</text>
    <text x="1070" y="256" text-anchor="middle" fill="#9aa89a" font-size="12" font-family="Segoe UI, Microsoft YaHei, sans-serif">可确认 / 拒绝</text>
    <text x="1070" y="278" text-anchor="middle" fill="#9aa89a" font-size="12" font-family="Segoe UI, Microsoft YaHei, sans-serif">可暂停 · 可跳过</text>
    <rect x="980" y="380" width="180" height="160" rx="16" fill="#1a2420" stroke="#456050"/>
    <text x="1070" y="430" text-anchor="middle" fill="#c7e6d2" font-size="15" font-weight="700" font-family="Segoe UI, Microsoft YaHei, sans-serif">本机记忆</text>
    <text x="1070" y="456" text-anchor="middle" fill="#9aa89a" font-size="12" font-family="Segoe UI, Microsoft YaHei, sans-serif">会话摘要回写</text>
    <text x="1070" y="478" text-anchor="middle" fill="#9aa89a" font-size="12" font-family="Segoe UI, Microsoft YaHei, sans-serif">不上传原始 EEG</text>
  </g>

  <!-- feedback arrow -->
  <path d="M1070 540 C1070 620, 168 620, 168 540" fill="none" stroke="#5f7464" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <text x="620" y="650" text-anchor="middle" fill="#7f9080" font-size="12" font-family="Segoe UI, Microsoft YaHei, sans-serif">反馈闭环（本机）· Soft Healthcare · 调节与福祉支持，不诊疗</text>
  <text x="48" y="700" fill="#556055" font-size="11" font-family="Segoe UI, Microsoft YaHei, sans-serif">依据：docs/agent-lab 现行 Multi-Agent 边界 · 单 Agent 对话另走 combo，不经会诊</text>
</svg>
